name: rewards-lab
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: rewards
      POSTGRES_USER: rewards
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-rewards-db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - rewards-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "rewards", "-d", "rewards"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/rewards
      DB_USER: rewards
      DB_PASSWORD: ${DB_PASSWORD:-local-rewards-db}
      LOGGING_FILE_NAME: /var/log/rewards/api.json
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin-pass}
    volumes:
      - api-logs:/var/log/rewards
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    profiles: [logs]
    networks: [logging]
    environment:
      discovery.type: single-node
      xpack.license.self_generated.type: basic
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1536m
    volumes:
      - search-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s"]
      interval: 5s
      timeout: 5s
      retries: 40
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.6
    profiles: [logs]
    networks: [logging]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      TELEMETRY_OPTIN: "false"
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5601/api/status"]
      interval: 5s
      timeout: 5s
      retries: 60
  logs-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    profiles: [logs]
    networks: [logging]
    depends_on:
      kibana:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/setup/bootstrap.sh"]
    volumes:
      - ./observability:/setup:ro
    restart: "no"
  filebeat:
    image: docker.elastic.co/beats/filebeat:9.5.6
    profiles: [logs]
    networks: [logging]
    depends_on:
      api:
        condition: service_healthy
      logs-setup:
        condition: service_completed_successfully
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./observability/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - api-logs:/var/log/rewards:ro
      - filebeat-state:/usr/share/filebeat/data
volumes:
  rewards-data:
  api-logs:
  search-data:
  filebeat-state:
networks:
  logging:
