filebeat.inputs:
  - type: filestream
    id: rewards-api-json
    paths: ["/var/log/rewards/api*.json"]
    prospector.scanner.check_interval: 2s
    backoff.init: 1s
    backoff.max: 2s
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          expand_keys: true
          add_error_key: true

queue.mem.flush.timeout: 1s
output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "rewards-api-%{+yyyy.MM.dd}"
setup.ilm.enabled: false
setup.template.enabled: false
