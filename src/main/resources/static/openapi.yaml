openapi: 3.0.3
info:
  title: Rewards Practice API
  version: 2.0.0
  description: Учебный REST API для создания пользователей, каталога наград и персональных выдач.
servers:
  - url: http://localhost:8080/api/v1
security:
  - basicAuth: []
tags:
  - name: Users
  - name: Rewards
  - name: Grants
paths:
  /users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Создать пользователя
      description: ADMIN. Email уникален без учёта регистра. Пароль используется для HTTP Basic.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUser' }
      responses:
        '201':
          description: Создано
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /users/{userId}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Прочитать профиль
      description: ADMIN или владелец профиля.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rewards:
    post:
      tags: [Rewards]
      operationId: createReward
      summary: Создать награду
      description: ADMIN. Код уникален и остаётся постоянным.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReward' }
      responses:
        '201':
          description: Создано
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reward' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
    get:
      tags: [Rewards]
      operationId: listRewards
      summary: Получить страницу каталога
      description: ADMIN и USER. Сортировка по коду в порядке возрастания.
      parameters:
        - { $ref: '#/components/parameters/Active' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RewardPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rewards/{rewardId}:
    get:
      tags: [Rewards]
      operationId: getReward
      summary: Прочитать награду
      description: ADMIN и USER.
      parameters:
        - { $ref: '#/components/parameters/RewardId' }
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reward' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Rewards]
      operationId: updateReward
      summary: Заменить редактируемые свойства награды
      description: ADMIN. Пропущенные description и issuanceLimit очищаются. Изменения применяются к будущим выдачам. Лимит не может стать меньше уже выданного количества.
      parameters:
        - { $ref: '#/components/parameters/RewardId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateReward' }
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reward' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /grants:
    post:
      tags: [Grants]
      operationId: issueReward
      summary: Выдать награду пользователю
      description: ADMIN. Первый успех сохраняет ключ. Повтор с теми же идентификаторами возвращает исходные 201 и тело с ACTIVE и usedAt=null, в том числе после использования или истечения. Другие идентификаторы с этим ключом дают 409. Ошибки ключ не занимают. Пользователю можно выдать конкретную награду только один раз.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueReward' }
      responses:
        '201':
          description: Создано
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /users/{userId}/grants:
    get:
      tags: [Grants]
      operationId: listUserGrants
      summary: Получить историю наград пользователя
      description: ADMIN или владелец. Текущие статусы. Сначала свежие выдачи, при совпадении времени по id по возрастанию.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/Status' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rewards/{rewardId}/grants:
    get:
      tags: [Grants]
      operationId: listRewardGrants
      summary: Получить выдачи награды и ID получателей
      description: ADMIN. Сначала свежие выдачи, при совпадении времени по id по возрастанию.
      parameters:
        - { $ref: '#/components/parameters/RewardId' }
        - { $ref: '#/components/parameters/Status' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{userId}/grants/{grantId}/use:
    post:
      tags: [Grants]
      operationId: useGrant
      summary: Использовать выданную награду
      description: ADMIN или владелец. Операция переводит ACTIVE в USED ровно один раз. Выдача должна принадлежать указанному пользователю.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/GrantId' }
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  headers:
    RequestId:
      description: Уникальный ID попытки запроса для поиска в логах API и Kibana.
      schema: { type: string, format: uuid }
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: ADMIN входит как admin. USER использует email и пароль из запроса создания.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 100000, maximum: 999999999999, example: 484658374 }
    RewardId:
      name: rewardId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1, example: 1 }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
    Active:
      name: active
      in: query
      required: false
      schema: { type: boolean }
    Status:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/GrantStatus' }
  responses:
    BadRequest:
      description: INVALID_REQUEST. Неверное тело, заголовок, параметр или значение поля.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: UNAUTHORIZED. Требуются корректные учётные данные.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: FORBIDDEN. Недостаточно прав для операции или доступа к чужим данным.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: USER_NOT_FOUND, REWARD_NOT_FOUND или GRANT_NOT_FOUND.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: EMAIL_EXISTS, REWARD_CODE_EXISTS, ALREADY_GRANTED, REWARD_INACTIVE, LIMIT_REACHED, LIMIT_BELOW_ISSUED, IDEMPOTENCY_KEY_REUSED, GRANT_USED или GRANT_EXPIRED.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE. Для запроса с телом используйте application/json.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    CreateUser:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, pattern: '\S' }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 128, pattern: '\S', writeOnly: true }
    UserProfile:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer, format: int64, minimum: 100000, maximum: 999999999999, example: 484658374 }
        name: { type: string, minLength: 1, maxLength: 100, pattern: '\S' }
        email: { type: string, format: email, maxLength: 254 }
    CreateReward:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$', example: WELCOME }
        name: { type: string, minLength: 1, maxLength: 120, pattern: '\S' }
        description: { type: string, maxLength: 1000, nullable: true }
        active: { type: boolean, default: true, nullable: true }
        validitySeconds: { type: integer, format: int32, minimum: 1, maximum: 315360000, default: 604800, nullable: true }
        issuanceLimit: { type: integer, format: int32, minimum: 1, nullable: true, description: 'null означает неограниченный тираж.' }
    UpdateReward:
      type: object
      additionalProperties: false
      required: [name, active, validitySeconds]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, pattern: '\S' }
        description: { type: string, maxLength: 1000, nullable: true }
        active: { type: boolean }
        validitySeconds: { type: integer, format: int32, minimum: 1, maximum: 315360000 }
        issuanceLimit: { type: integer, format: int32, minimum: 1, nullable: true, description: 'null означает неограниченный тираж.' }
    Reward:
      type: object
      required: [id, code, name, description, active, validitySeconds, issuanceLimit]
      properties:
        id: { type: integer, format: int64, minimum: 1, example: 1 }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$', example: WELCOME }
        name: { type: string, minLength: 1, maxLength: 120, pattern: '\S' }
        description: { type: string, maxLength: 1000, nullable: true }
        active: { type: boolean }
        validitySeconds: { type: integer, format: int32, minimum: 1, maximum: 315360000 }
        issuanceLimit: { type: integer, format: int32, minimum: 1, nullable: true, description: 'null означает неограниченный тираж.' }
    IssueReward:
      type: object
      additionalProperties: false
      required: [userId, rewardId]
      properties:
        userId: { type: integer, format: int64, minimum: 100000, maximum: 999999999999, example: 484658374 }
        rewardId: { type: integer, format: int64, minimum: 1, example: 1 }
    GrantStatus:
      type: string
      enum: [ACTIVE, USED, EXPIRED]
      description: ACTIVE при текущем времени раньше expiresAt. С момента expiresAt неиспользованная выдача EXPIRED. USED сохраняется после истечения срока.
    Grant:
      type: object
      required: [id, userId, rewardId, rewardCode, rewardName, issuedAt, expiresAt, usedAt, status]
      properties:
        id: { type: string, format: uuid }
        userId: { type: integer, format: int64, minimum: 100000, maximum: 999999999999, example: 484658374 }
        rewardId: { type: integer, format: int64, minimum: 1, example: 1 }
        rewardCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$', example: WELCOME }
        rewardName: { type: string, minLength: 1, maxLength: 120, pattern: '\S' }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        usedAt: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/GrantStatus' }
    GrantPage:
      type: object
      required: [items, page, size, hasNext]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Grant' } }
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }
        hasNext: { type: boolean }
    RewardPage:
      type: object
      required: [items, page, size, hasNext]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Reward' } }
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }
        hasNext: { type: boolean }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
